components:
    schemas:
        IdpConnection:
            # @review
            description:
                Connection details for a connected SAML IDP
            properties:
                assertionSignatureRequired:
                    type: boolean
                clockSkew:
                    format: int64
                    type: integer
                enabled:
                    type: boolean
                entityId:
                    type: string
                forceAuthn:
                    type: boolean
                id:
                    format: int64
                    type: integer
                metadataUpdatedDate:
                    format: date-time
                    readOnly: true
                    type: string
                metadataUrl:
                    type: string
                metadataXml:
                    type: string
                name:
                    type: string
                nameIdFormat:
                    type: string
                signAuthnRequest:
                    type: boolean
                unknownUsersAreStrangers:
                    type: boolean
                userAttributeMappings:
                    type: string
            type: object
        Idp:
            # @review
            description:
                Configuration of the SAML provider's IDP capability
            properties:
                authnRequestSignatureRequired:
                    type: boolean
                sessionMaximumAge:
                    format: int64
                    type: integer
                sessionTimeout:
                    format: int64
                    type: integer
                signMetadata:
                    type: boolean
                spConnections:
                    description:
                        Connected SAML SPs
                    items:
                        $ref: "#/components/schemas/SpConnection"
                    type: array
                sslRequired:
                    type: boolean
            type: object
        Metadata:
            description:
                Represents a SAML metadata XML
            properties:
                contentUrl:
                    description:
                        The file's relative URL.
                    readOnly: true
                    type: string
                contentValue:
                    # @review
                    description:
                        optional field with the content of the metadata in Base64
                    readOnly: true
                    type: string
                metadataUpdatedDate:
                    format: date-time
                    readOnly: true
                    type: string
            type: object
        Provider:
            description:
                Dummy schema which can be referenced from tags
            properties:
                enabled:
                    type: boolean
                entityId:
                    type: string
                role:
                    type: string
                    enum: [idp, sp]
                idp:
                    $ref: "#/components/schemas/Idp"
                sp:
                    $ref: "#/components/schemas/Sp"
            type: object
        SpConnection:
            # @review
            description:
                Connection details for a connected SAML SP
            properties:
                enabled:
                    type: boolean
        Sp:
            # @review
            description:
                Configuration of the SAML provider's SP capability
            properties:
                allowShowingTheLoginPortlet:
                    type: boolean
                assertionSignatureRequired:
                    type: boolean
                authnRequestSignatureRequired:
                    type: boolean
                clockSkew:
                    format: int64
                    type: integer
                defaultAssertionLifetime:
                    type: integer
                idpConnections:
                    description:
                        Connected SAML IDPs
                    items:
                        $ref: "#/components/schemas/IdpConnection"
                    type: array
                keyStoreCredentialPassword:
                    type: string
                ldapImportEnabled:
                    type: boolean
                samlKeystoreCredentialPassword:
                    type: string
                sessionMaximumAge:
                    format: int64
                    type: integer
                sessionTimeout:
                    format: int64
                    type: integer
                signAuthnRequest:
                    type: boolean
                signMetadata:
                    type: boolean
                sslRequired:
                    type: boolean
            type: object
info:
    description:
        "SAML configuration"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "Headless Admin SAML"
    version: v1.0
openapi: 3.0.1
paths:
    "/idpConnections":
        get:
            # @review
            description:
                Retrieves the connected SAML IDPs
            operationId: getIdpConnections
            parameters:
                - in: query
                  name: page
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  schema:
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/IdpConnection"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/IdpConnection"
                                type: array
            tags: ["IdpConnection"]
        post:
            description:
                Creates a new SAML IDP connection
            operationId: postIdpConnection
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/IdpConnection"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/IdpConnection"
            responses:
                201:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/IdpConnection"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/IdpConnection"
                    # @review
                    description:
                        "SAML SP IDP connection successfully created"
            tags: ["IdpConnection"]
    "/idpConnections/{idpConnectionId}":
        delete:
            # @review
            description:
                Deletes the SAML IDP connection
            operationId: deleteIdpConnection
            parameters:
                - in: path
                  name: idpConnectionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["IdpConnection"]
        get:
            description:
                Retrieves the SAML IDP connection.
            operationId: getIdpConnection
            parameters:
                - in: path
                  name: idpConnectionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/IdpConnection"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/IdpConnection"
            tags: ["IdpConnection"]
        patch:
            description:
                Updates the SAML IDP Connection with information sent in the request body. Only the provided fields are
                updated.
            operationId: patchIdpConnection
            parameters:
                - in: path
                  name: idpConnectionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/IdpConnection"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/IdpConnection"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/IdpConnection"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/IdpConnection"
                    # @review
                    description:
                        "SAML SP IDP connection successfully created"
            tags: ["IdpConnection"]
        put:
            description:
                Replaces the SAML IDP connection with information sent in the request body. Any missing fields are
                deleted unless they are required.
            operationId: putIdpConnection
            parameters:
                - in: path
                  name: idpConnectionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/IdpConnection"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/IdpConnection"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/IdpConnection"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/IdpConnection"
                    # @review
                    description:
                        "SAML SP IDP connection successfully created"
            tags: ["IdpConnection"]
    "/idpConnections/{idpConnectionId}/metadata":
        get:
            description:
                Retrieves the associated SAML metadata
            operationId: getIdpConnectionMetadata
            parameters:
                - in: path
                  name: idpConnectionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Metadata"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Metadata"
            tags: ["Metadata"]
        post:
            description:
                Creates a new metadata for an existing IDP connection. The request body must be `multipart/form-data`
                with two parts, a `file` part with the file's bytes, and an optional JSON string (`Metadata`) with the
                metadata.
            operationId: postIdpConnectionMetadata
            parameters:
                - in: path
                  name: idpConnectionId
                  required: true
                  schema:
                      format: int64
                      type: integer
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                                knowledgeBaseAttachment:
                                    $ref: "#/components/schemas/Metadata"
                            type: object
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Metadata"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Metadata"
            tags: ["Metadata"]
    "/provider":
        get:
            description:
                Retrieves the SAML Provider configuration.
            operationId: getProvider
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Provider"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Provider"
            tags: ["Provider"]
        post:
            description:
                Creates a full SAML Provider configuration with peer connections.
            operationId: postProvider
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Provider"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/Provider"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Provider"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Provider"
                    # @review
                    description:
                        "SAML provider configuration was successfully created"
            tags: ["Provider"]
    "/provider/{roleId}":
        delete:
            description:
                Delete the SAML SP Provider configuration.
            operationId: deleteRole
            parameters:
                - in: path
                  name: roleId
                  required: true
                  schema:
                      type: string
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["Provider"]
        get:
            description:
                Retrieves the SAML SP Provider configuration.
            operationId: getProvider
            parameters:
                - in: path
                  name: roleId
                  required: true
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                oneOf:
                                  - $ref: "#/components/schemas/Idp"
                                  - $ref: "#/components/schemas/Sp"
                        application/xml:
                            schema:
                                oneOf:
                                  - $ref: "#/components/schemas/Idp"
                                  - $ref: "#/components/schemas/Sp"
            tags: ["Provider"]
        patch:
            description:
                Patch the SAML SP Provider configuration.
            operationId: patchRole
            parameters:
                - in: path
                  name: roleId
                  required: true
                  schema:
                      type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/Idp"
                                - $ref: "#/components/schemas/Sp"
                    application/xml:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/Idp"
                                - $ref: "#/components/schemas/Sp"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/Idp"
                                    - $ref: "#/components/schemas/Sp"
                        application/xml:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/Idp"
                                    - $ref: "#/components/schemas/Sp"
                    # @review
                    description:
                        "SAML provider configuration was successfully created"
            tags: ["Provider"]
        put:
            description:
                Replaces the SAML SP Provider configuration.
            operationId: putRole
            parameters:
                - in: path
                  name: roleId
                  required: true
                  schema:
                      type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/Idp"
                                - $ref: "#/components/schemas/Sp"
                    application/xml:
                        schema:
                            oneOf:
                                - $ref: "#/components/schemas/Idp"
                                - $ref: "#/components/schemas/Sp"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/Idp"
                                    - $ref: "#/components/schemas/Sp"
                        application/xml:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/Idp"
                                    - $ref: "#/components/schemas/Sp"
                    # @review
                    description:
                        "SAML provider configuration was successfully created"
            tags: ["Provider"]